server.port=8089
spring.datasource.url=jdbc:mysql://localhost:3306/admin_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
jwt.secret=carwash-super-secret-key-which-is-long-enough-for-hs256-algorithm
jwt.expiration=86400000
spring.cloud.openfeign.okhttp.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Circuit Breaker instances for each downstream service
resilience4j.circuitbreaker.instances.userServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.userServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userServiceCB.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.washServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.washServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.washServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.washServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.washServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.washServiceCB.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.paymentServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.paymentServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentServiceCB.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.reviewServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.reviewServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.reviewServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.reviewServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.reviewServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.reviewServiceCB.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.notificationServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.notificationServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notificationServiceCB.automatic-transition-from-open-to-half-open-enabled=true

# Retry config for all downstream calls
resilience4j.retry.instances.adminRetry.max-attempts=3
resilience4j.retry.instances.adminRetry.wait-duration=1s

# Actuator
management.health.circuitbreakers.enabled=true
management.health.retryevents.enabled=true
